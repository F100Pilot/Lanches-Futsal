<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0B1220">
    <title>Lanches Futsal</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230B1220' stroke='%23A3E635' stroke-width='2.5'/><path d='M16 9l5 3.6-1.9 5.9h-6.2L11 12.6z' fill='%23A3E635'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg:          #0B1220;
            --surface:     #131C2E;
            --surface-2:   #1A2438;
            --line:        #243049;
            --text:        #E8EEF8;
            --muted:       #93A1B8;
            --accent:      #A3E635;
            --accent-ink:  #0B1220;
            --accent-soft: #1E3A12;
            --warn:        #FBBF24;
            --warn-soft:   #3B2F0B;
            --danger:      #F87171;
            --danger-soft: #3A1717;
            --radius:      18px;
            --radius-sm:   12px;
            --display:     'Barlow Condensed', 'Arial Narrow', sans-serif;
            --body:        Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --ease:        cubic-bezier(.2, .8, .2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: var(--body); font-size: 15px; line-height: 1.45;
            min-height: 100vh; -webkit-font-smoothing: antialiased;
        }
        button, input, select { font: inherit; color: inherit; }
        button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .hidden { display: none !important; }
        body:not(.is-editor) .admin-only { display: none !important; }

        .container {
            max-width: 560px; margin: 0 auto;
            padding: 20px 16px calc(110px + env(safe-area-inset-bottom));
            display: flex; flex-direction: column; gap: 16px;
        }
        .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; }

        /* ── HEADER ── */
        .header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .brand-mark { flex-shrink: 0; transition: transform .6s var(--ease); }
        .brand:hover .brand-mark { transform: rotate(72deg); }
        .brand-name { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: 1px; line-height: 1; }
        .brand-name span { color: var(--accent); }
        .brand-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 3px; }
        .status-dot { width: 8px; height: 8px; border-radius: 4px; background: var(--muted); flex-shrink: 0; }
        .status-dot.online     { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        .status-dot.connecting { background: var(--warn); animation: blink 1s infinite; }
        .status-dot.offline    { background: var(--danger); }
        @keyframes blink { 50% { opacity: .35; } }
        .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .icon-btn {
            width: 44px; height: 44px; border-radius: var(--radius-sm);
            border: 1px solid var(--line); background: var(--surface); color: var(--text);
            display: flex; align-items: center; justify-content: center;
            transition: background .2s, border-color .2s, transform .15s;
        }
        .icon-btn:hover { background: var(--surface-2); border-color: #34425f; }
        .icon-btn:active { transform: scale(.94); }
        .icon-btn.spinning svg { animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .user-chip {
            width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0;
            background: var(--accent-soft); color: var(--accent);
            display: flex; align-items: center; justify-content: center;
            font-family: var(--display); font-size: 22px; font-weight: 700; text-transform: uppercase;
        }

        /* ── HERO (próximo lanche) ── */
        .hero {
            background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
            padding: 16px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden;
        }
        .hero::after {
            content: ''; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px;
            border-radius: 50%; border: 18px solid var(--accent); opacity: .07; pointer-events: none;
        }
        .hero-date { font-family: var(--display); font-weight: 800; font-size: 46px; line-height: 1; color: var(--accent); text-transform: uppercase; }
        .hero-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .hero-label { font-size: 12px; color: var(--muted); }
        .hero-name { font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
        .hero-note { font-size: 13px; color: var(--muted); }

        /* ── SCOREBOARD ── */
        .score { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
        .score-cell { background: var(--surface); border-radius: 14px; padding: 12px 8px; text-align: center; }
        .score-num { font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; }
        .score-num.delivered { color: var(--accent); }
        .score-num.pending { color: var(--warn); }
        .score-label { font-size: 11px; letter-spacing: 1px; color: var(--muted); margin-top: 4px; text-transform: uppercase; }
        .progress { display: flex; align-items: center; gap: 10px; margin-top: -6px; }
        .progress-track { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
        .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .8s var(--ease); }
        .progress-pct { font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--muted); min-width: 40px; text-align: right; }

        /* ── FILTERS ── */
        .segmented {
            display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;
            padding: 4px; background: var(--surface); border-radius: var(--radius-sm);
        }
        .segmented button {
            height: 38px; border: 0; border-radius: 9px; background: transparent;
            color: var(--muted); font-size: 13px; font-weight: 600; transition: background .2s, color .2s;
        }
        .segmented button.active { background: var(--accent); color: var(--accent-ink); }
        .search {
            display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px;
            border: 1px solid var(--line); border-radius: var(--radius-sm); color: var(--muted);
            transition: border-color .2s;
        }
        .search:focus-within { border-color: var(--accent); }
        .search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--text); font-size: 15px; outline: none; }
        .search input::placeholder { color: var(--muted); }

        /* ── LIST ── */
        .list { display: flex; flex-direction: column; gap: 8px; }
        .group-label { margin: 10px 0 2px; }
        .group-label:first-child { margin-top: 0; }
        .section-divider { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
        .section-divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
        .item {
            display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 6px;
            background: var(--surface); border-radius: 14px;
            transition: opacity .3s;
        }
        .item.done { opacity: .75; }
        .item.past { opacity: .6; }
        .item-main {
            flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px;
            padding: 6px; border: 0; background: transparent; text-align: left; border-radius: 10px;
        }
        button.item-main:hover { background: var(--surface-2); }
        .date-block { width: 46px; flex-shrink: 0; text-align: center; border-right: 1px solid var(--line); padding-right: 10px; }
        .date-day { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1; }
        .date-wd { font-size: 11px; color: var(--muted); }
        .item-info { min-width: 0; }
        .item-name { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
        .item.done .item-name { text-decoration: line-through; text-decoration-color: var(--muted); }
        .item-note { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }

        .chip {
            flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px;
            padding: 0 12px; height: 32px; border-radius: 999px; border: 0;
            font-size: 12px; font-weight: 600; white-space: nowrap;
            transition: transform .15s, background .2s;
        }
        .chip-done    { background: var(--accent-soft); color: var(--accent); }
        .chip-pending { background: var(--warn-soft); color: var(--warn); }
        button.chip { height: 44px; padding: 0 14px; }
        button.chip:active { transform: scale(.92); }
        button.chip:disabled { opacity: .5; cursor: progress; }
        .chip svg { flex-shrink: 0; }

        .stagger { animation: rise .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 35ms); }
        @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
        .pop { animation: pop .35s var(--ease); }
        @keyframes pop { 40% { transform: scale(1.12); } }

        .empty { text-align: center; padding: 36px 16px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .empty svg { color: var(--line); }
        .skeleton { height: 62px; border-radius: 14px; background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
        @keyframes shimmer { to { background-position: -200% 0; } }

        /* ── FAB ── */
        .fab {
            position: fixed; right: max(20px, calc(50% - 260px)); bottom: calc(24px + env(safe-area-inset-bottom));
            width: 60px; height: 60px; border-radius: 20px; border: 0;
            background: var(--accent); color: var(--accent-ink);
            box-shadow: 0 10px 28px rgba(163, 230, 53, .28); z-index: 50;
            display: flex; align-items: center; justify-content: center;
            transition: transform .2s var(--ease);
        }
        .fab:hover { transform: translateY(-2px); }
        .fab:active { transform: scale(.94); }

        /* ── SHEETS & DIALOGS ── */
        .overlay {
            position: fixed; inset: 0; z-index: 100; background: rgba(3, 7, 18, .6);
            display: flex; align-items: flex-end; justify-content: center;
            animation: fade .2s ease;
        }
        .overlay.center { align-items: center; padding: 16px; }
        @keyframes fade { from { opacity: 0; } }
        .sheet {
            width: 100%; max-width: 560px; background: var(--surface); border: 1px solid var(--line); border-bottom: 0;
            border-radius: 28px 28px 0 0; padding: 12px 20px calc(24px + env(safe-area-inset-bottom));
            display: flex; flex-direction: column; gap: 14px; max-height: 92vh; overflow-y: auto;
            animation: slideUp .3s var(--ease);
        }
        @keyframes slideUp { from { transform: translateY(100%); } }
        .dialog {
            width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line);
            border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; gap: 14px;
            animation: rise .25s var(--ease);
        }
        .grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; }
        .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .sheet-title { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1; text-transform: uppercase; letter-spacing: .5px; }
        .sheet-sub { font-size: 14px; color: var(--muted); }

        .field { display: flex; flex-direction: column; gap: 6px; }
        .field-label { font-size: 13px; font-weight: 600; color: var(--muted); }
        .field-label small { font-weight: 400; }
        .input {
            height: 48px; padding: 0 14px; border-radius: 14px;
            border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 16px;
            transition: border-color .2s; width: 100%;
        }
        .input:focus { outline: none; border-color: var(--accent); }
        .toggle-group { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); }
        .toggle-group input { position: absolute; opacity: 0; pointer-events: none; }
        .toggle-group label {
            height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; transition: background .2s, color .2s;
        }
        .toggle-group input:checked + label.opt-pending { background: var(--warn-soft); color: var(--warn); }
        .toggle-group input:checked + label.opt-done { background: var(--accent-soft); color: var(--accent); }
        .toggle-group input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }

        .btn {
            height: 52px; border-radius: 16px; border: 0; font-size: 16px; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
            transition: transform .15s, opacity .2s;
        }
        .btn:active { transform: scale(.98); }
        .btn:disabled { opacity: .55; cursor: progress; }
        .btn-primary { background: var(--accent); color: var(--accent-ink); }
        .btn-ghost { background: var(--surface-2); color: var(--text); }
        .btn-danger { background: var(--danger-soft); color: var(--danger); }
        .btn-row { display: flex; gap: 10px; }
        .form-error { color: var(--danger); font-size: 13px; min-height: 1.2em; }

        /* ── TOASTS ── */
        .toasts {
            position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
            z-index: 200; display: flex; flex-direction: column; gap: 8px; width: min(420px, calc(100% - 32px));
        }
        .toast {
            display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px;
            background: var(--surface-2); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.4);
            font-size: 14px; animation: rise .3s var(--ease);
        }
        .toast-dot { width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; background: var(--accent); }
        .toast.error .toast-dot { background: var(--danger); }
        .toast.warning .toast-dot { background: var(--warn); }
        .toast.info .toast-dot { background: var(--muted); }
        .toast-msg { flex: 1; }
        .toast-close { border: 0; background: transparent; color: var(--muted); width: 28px; height: 28px; font-size: 18px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></g></symbol>
    <symbol id="i-ball" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/></g></symbol>
</svg>

<div class="container">

    <header class="header">
        <div class="brand">
            <svg class="brand-mark" width="34" height="34" viewBox="0 0 32 32" aria-hidden="true">
                <circle cx="16" cy="16" r="14" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
                <path d="M16 9l5 3.6-1.9 5.9h-6.2L11 12.6z" fill="var(--accent)"/>
            </svg>
            <div>
                <h1 class="brand-name">LANCHES <span>FUTSAL</span></h1>
                <div class="brand-status" role="status">
                    <span class="status-dot connecting" id="statusDot"></span>
                    <span id="statusText">A conectar...</span>
                    <span id="lastSync"></span>
                </div>
            </div>
        </div>
        <div class="header-actions">
            <span class="user-chip admin-only" id="userChip"></span>
            <button class="icon-btn" id="refreshBtn" title="Recarregar" aria-label="Recarregar dados">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
            </button>
            <button class="icon-btn" id="loginBtn" title="Entrar (editores)" aria-label="Entrar como editor">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            </button>
            <button class="icon-btn admin-only" id="logoutBtn" title="Terminar sessão" aria-label="Terminar sessão">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/></svg>
            </button>
        </div>
    </header>

    <section class="hero hidden" id="hero" aria-labelledby="heroEyebrow">
        <span class="eyebrow" id="heroEyebrow">Próximo lanche</span>
        <div class="hero-date" id="heroDate"></div>
        <div class="hero-row">
            <div>
                <div class="hero-label">A cargo de</div>
                <div class="hero-name" id="heroName"></div>
                <div class="hero-note" id="heroNote"></div>
            </div>
            <span id="heroChip"></span>
        </div>
    </section>

    <section aria-label="Resumo">
        <div class="score">
            <div class="score-cell"><div class="score-num" id="totalCount">–</div><div class="score-label">Total</div></div>
            <div class="score-cell"><div class="score-num delivered" id="deliveredCount">–</div><div class="score-label">Entregues</div></div>
            <div class="score-cell"><div class="score-num pending" id="pendingCount">–</div><div class="score-label">Pendentes</div></div>
        </div>
    </section>
    <div class="progress" aria-label="Progresso de entrega">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <span class="progress-pct" id="progressPct">0%</span>
    </div>

    <div class="segmented" role="group" aria-label="Filtrar">
        <button class="active" data-filter="all" aria-pressed="true">Todos</button>
        <button data-filter="pending" aria-pressed="false">Pendentes</button>
        <button data-filter="delivered" aria-pressed="false">Entregues</button>
    </div>
    <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="searchInput" placeholder="Pesquisar atleta…" aria-label="Pesquisar atleta">
    </label>

    <div id="lanchesList" class="list" aria-live="polite">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
</div>

<button class="fab admin-only" id="addBtn" aria-label="Adicionar lanche" title="Adicionar lanche">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="toasts" id="toastContainer" aria-live="assertive"></div>

<!-- FOLHA: ADICIONAR / EDITAR -->
<div class="overlay hidden" id="lancheModal">
    <form class="sheet" id="lancheForm" role="dialog" aria-modal="true" aria-labelledby="lancheTitle">
        <div class="grabber" aria-hidden="true"></div>
        <div class="sheet-head">
            <h2 class="sheet-title" id="lancheTitle">Novo lanche</h2>
            <button type="button" class="icon-btn" data-close="lancheModal" aria-label="Fechar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
        <label class="field">
            <span class="field-label">Nome do atleta</span>
            <input class="input" id="athleteName" required maxlength="100" autocomplete="off" placeholder="Ex: João Silva">
        </label>
        <label class="field">
            <span class="field-label">Data</span>
            <input class="input" type="date" id="lunchDate" required>
        </label>
        <div class="field">
            <span class="field-label" id="statusLabel">Estado</span>
            <div class="toggle-group" role="radiogroup" aria-labelledby="statusLabel">
                <input type="radio" name="entregue" id="optPending" value="false" checked>
                <label for="optPending" class="opt-pending">Pendente</label>
                <input type="radio" name="entregue" id="optDone" value="true">
                <label for="optDone" class="opt-done">Entregue</label>
            </div>
        </div>
        <label class="field">
            <span class="field-label">Observações <small>(opcional)</small></span>
            <input class="input" id="lunchNotes" maxlength="300" placeholder="Ex: jogo em casa">
        </label>
        <button type="submit" class="btn btn-primary" id="saveBtn">Adicionar lanche</button>
        <button type="button" class="btn btn-danger hidden" id="deleteBtn">Eliminar lanche</button>
    </form>
</div>

<!-- LOGIN -->
<div class="overlay center hidden" id="loginModal">
    <form class="dialog" id="loginForm" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
        <h2 class="sheet-title" id="loginTitle">Acesso de editor</h2>
        <p class="sheet-sub">Apenas os responsáveis da equipa podem alterar a informação.</p>
        <label class="field">
            <span class="field-label">Email</span>
            <input class="input" type="email" id="loginEmail" autocomplete="username" required>
        </label>
        <label class="field">
            <span class="field-label">Password</span>
            <input class="input" type="password" id="loginPassword" autocomplete="current-password" required>
        </label>
        <p class="form-error" id="loginError"></p>
        <div class="btn-row">
            <button type="button" class="btn btn-ghost" data-close="loginModal">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="loginSubmitBtn">Entrar</button>
        </div>
    </form>
</div>

<!-- CONFIRMAR ELIMINAÇÃO -->
<div class="overlay center hidden" id="confirmModal">
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMsg">
        <h2 class="sheet-title" id="confirmTitle">Eliminar?</h2>
        <p class="sheet-sub" id="confirmMsg"></p>
        <div class="btn-row">
            <button type="button" class="btn btn-ghost" data-close="confirmModal">Cancelar</button>
            <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Eliminar</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"
        integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o"
        crossorigin="anonymous"></script>
<script>
/*
 * ============================================================
 *  LANCHES FUTSAL — index.html
 *  Stack: HTML + CSS + Vanilla JS  →  GitHub Pages (static)
 *         Supabase (Postgres + Auth + RLS)  →  base de dados
 *
 *  • Leitura pública (pais).
 *  • Escrita apenas para os editores definidos em public.editors
 *    (imposto pela base de dados, não pelo browser).
 *  • Configuração em config.json (supabaseUrl + supabaseKey publishable).
 *  • Setup completo: ver README.md e supabase/schema.sql.
 * ============================================================
 */

const REFRESH_INTERVAL_MS = 60_000;
const LANCHE_COLUMNS = 'id,nome,data,entregue,observacoes';
const WEEKDAYS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
                'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

// ── STATE ──────────────────────────────────────────────────
let db = null;
let isEditor = false;
let lanchesData = [];
let currentFilter = 'all';
let searchQuery = '';
let editTarget = null;      // id em edição (null = novo)
let deleteTarget = null;
let refreshTimer = null;

// ── DOM REFS ───────────────────────────────────────────────
const $ = id => document.getElementById(id);
const el = {
    statusDot: $('statusDot'), statusText: $('statusText'), lastSync: $('lastSync'),
    hero: $('hero'), heroDate: $('heroDate'), heroName: $('heroName'), heroNote: $('heroNote'), heroChip: $('heroChip'),
    totalCount: $('totalCount'), deliveredCount: $('deliveredCount'), pendingCount: $('pendingCount'),
    progressFill: $('progressFill'), progressPct: $('progressPct'),
    lanchesList: $('lanchesList'), searchInput: $('searchInput'),
    userChip: $('userChip'), refreshBtn: $('refreshBtn'), loginBtn: $('loginBtn'), logoutBtn: $('logoutBtn'),
    addBtn: $('addBtn'),
    lancheModal: $('lancheModal'), lancheForm: $('lancheForm'), lancheTitle: $('lancheTitle'),
    athleteName: $('athleteName'), lunchDate: $('lunchDate'), optPending: $('optPending'), optDone: $('optDone'),
    lunchNotes: $('lunchNotes'), saveBtn: $('saveBtn'), deleteBtn: $('deleteBtn'),
    loginModal: $('loginModal'), loginForm: $('loginForm'), loginEmail: $('loginEmail'),
    loginPassword: $('loginPassword'), loginError: $('loginError'), loginSubmitBtn: $('loginSubmitBtn'),
    confirmModal: $('confirmModal'), confirmMsg: $('confirmMsg'), confirmDeleteBtn: $('confirmDeleteBtn'),
    toastContainer: $('toastContainer'),
};

// ── TOAST ──────────────────────────────────────────────────
function showToast(msg, type = 'success', duration = 4000) {
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    const dot = document.createElement('span');
    dot.className = 'toast-dot';
    const text = document.createElement('span');
    text.className = 'toast-msg';
    text.textContent = msg;
    const close = document.createElement('button');
    close.className = 'toast-close';
    close.setAttribute('aria-label', 'Fechar');
    close.textContent = '×';
    close.addEventListener('click', () => t.remove());
    t.append(dot, text, close);
    el.toastContainer.appendChild(t);
    setTimeout(() => t.isConnected && t.remove(), duration);
}

// ── CONNECTION STATUS ──────────────────────────────────────
function setStatus(state, text) {
    el.statusDot.className = `status-dot ${state}`;
    el.statusText.textContent = text;
}

function updateLastSync() {
    const hm = new Date().toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
    el.lastSync.textContent = `· ${hm}`;
}

// ── DATE HELPERS (datas "AAAA-MM-DD", sem conversões de fuso horário) ──
function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function parseDate(raw) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(raw || '');
    if (!m) return null;
    const [y, mo, d] = [Number(m[1]), Number(m[2]), Number(m[3])];
    return { y, mo, d, wd: WEEKDAYS[new Date(y, mo - 1, d).getDay()] };
}

function escHtml(t) {
    const d = document.createElement('div');
    d.textContent = t == null ? '' : String(t);
    return d.innerHTML;
}

// ── MODALS ─────────────────────────────────────────────────
function openModal(modal, focusEl) {
    modal.classList.remove('hidden');
    if (focusEl) setTimeout(() => focusEl.focus(), 60);
}

function closeModal(modal) {
    modal.classList.add('hidden');
    if (modal === el.lancheModal) editTarget = null;
    if (modal === el.confirmModal) deleteTarget = null;
}

// ── RENDER ─────────────────────────────────────────────────
function chipHtml(lanche, interactive) {
    const done = lanche.entregue;
    const cls = done ? 'chip chip-done' : 'chip chip-pending';
    const icon = `<svg width="14" height="14" aria-hidden="true"><use href="#${done ? 'i-check' : 'i-clock'}"/></svg>`;
    const label = done ? 'Entregue' : 'Pendente';
    if (!interactive) return `<span class="${cls}">${icon}${label}</span>`;
    const action = done ? 'Marcar como pendente' : 'Marcar como entregue';
    return `<button class="${cls}" data-action="toggle" aria-label="${action}: ${escHtml(lanche.nome)}">${icon}${label}</button>`;
}

function animateNumber(node, to) {
    const from = Number(node.textContent) || 0;
    if (from === to) { node.textContent = to; return; }
    const start = performance.now();
    const step = now => {
        const p = Math.min(1, (now - start) / 500);
        node.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
}

function updateStats() {
    const total = lanchesData.length;
    const delivered = lanchesData.filter(l => l.entregue).length;
    const pct = total ? Math.round((delivered / total) * 100) : 0;
    animateNumber(el.totalCount, total);
    animateNumber(el.deliveredCount, delivered);
    animateNumber(el.pendingCount, total - delivered);
    el.progressFill.style.width = pct + '%';
    el.progressPct.textContent = pct + '%';
}

function renderHero() {
    const today = todayStr();
    const next = lanchesData
        .filter(l => l.data >= today)
        .sort((a, b) => a.data.localeCompare(b.data) || a.id - b.id)[0];
    el.hero.classList.toggle('hidden', !next);
    if (!next) return;
    const p = parseDate(next.data);
    el.heroDate.textContent = p ? `${p.wd} · ${p.d} ${MONTHS[p.mo - 1].slice(0, 3)}` : next.data;
    el.heroName.textContent = next.nome;
    el.heroNote.textContent = next.observacoes || '';
    el.heroChip.innerHTML = chipHtml(next, false);
}

function itemHtml(l, index, isPast) {
    const p = parseDate(l.data);
    const note = l.observacoes ? `<div class="item-note">${escHtml(l.observacoes)}</div>` : '';
    const inner = `
        <div class="date-block">
            <div class="date-day">${p ? p.d : '?'}</div>
            <div class="date-wd">${p ? p.wd : ''}</div>
        </div>
        <div class="item-info">
            <div class="item-name">${escHtml(l.nome)}</div>
            ${note}
        </div>`;
    const main = isEditor
        ? `<button class="item-main" data-action="edit" aria-label="Editar lanche de ${escHtml(l.nome)}">${inner}</button>`
        : `<div class="item-main">${inner}</div>`;
    const cls = ['item', l.entregue ? 'done' : '', isPast ? 'past' : ''].join(' ');
    return `<article class="${cls}" data-id="${Number(l.id)}" style="--i:${Math.min(index, 12)}">${main}${chipHtml(l, isEditor)}</article>`;
}

function groupsHtml(items, isPast, startIndex) {
    const currentYear = new Date().getFullYear();
    let html = '';
    let lastKey = '';
    items.forEach((l, i) => {
        const p = parseDate(l.data);
        const key = p ? `${p.y}-${p.mo}` : 'other';
        if (key !== lastKey) {
            const label = p ? MONTHS[p.mo - 1] + (p.y !== currentYear ? ` ${p.y}` : '') : 'Sem data';
            html += `<div class="eyebrow group-label">${escHtml(label)}</div>`;
            lastKey = key;
        }
        html += itemHtml(l, startIndex + i, isPast);
    });
    return html;
}

function renderLanches({ animate = true } = {}) {
    let data = lanchesData;
    if (currentFilter === 'delivered') data = data.filter(l => l.entregue);
    if (currentFilter === 'pending') data = data.filter(l => !l.entregue);
    if (searchQuery) {
        const q = searchQuery.toLowerCase();
        data = data.filter(l => l.nome.toLowerCase().includes(q));
    }

    if (data.length === 0) {
        const msgs = {
            all: 'Ainda não há lanches registados.',
            delivered: 'Nenhum lanche entregue ainda.',
            pending: 'Todos os lanches foram entregues!',
        };
        const msg = searchQuery ? `Nenhum atleta encontrado para "${escHtml(searchQuery)}".` : msgs[currentFilter];
        el.lanchesList.innerHTML = `
            <div class="empty">
                <svg width="48" height="48" aria-hidden="true"><use href="#i-ball"/></svg>
                <p>${msg}</p>
            </div>`;
        return;
    }

    // Próximos (mais cedo primeiro) e anteriores (mais recente primeiro), agrupados por mês
    const today = todayStr();
    const upcoming = data.filter(l => l.data >= today).sort((a, b) => a.data.localeCompare(b.data) || a.id - b.id);
    const past = data.filter(l => l.data < today).sort((a, b) => b.data.localeCompare(a.data) || b.id - a.id);

    let html = groupsHtml(upcoming, false, 0);
    if (past.length) {
        html += `<div class="eyebrow section-divider">Anteriores</div>` + groupsHtml(past, true, upcoming.length);
    }
    el.lanchesList.innerHTML = html;
    if (animate) el.lanchesList.querySelectorAll('.item').forEach(n => n.classList.add('stagger'));
}

function renderAll(opts) {
    renderHero();
    renderLanches(opts);
    updateStats();
}

function findLanche(id) {
    return lanchesData.find(l => l.id === id);
}

// ── DATA: READ ─────────────────────────────────────────────
async function loadData({ silent = false } = {}) {
    if (!silent) setStatus('connecting', 'A carregar...');

    const { data, error } = await db.from('lanches').select(LANCHE_COLUMNS);
    if (error) {
        console.error('loadData:', error);
        setStatus('offline', 'Sem ligação');
        if (!silent) {
            showToast('Não foi possível carregar os dados.', 'error', 6000);
            el.lanchesList.innerHTML = `
                <div class="empty">
                    <svg width="48" height="48" aria-hidden="true"><use href="#i-ball"/></svg>
                    <p>Falha na ligação à base de dados.<br>Tenta de novo com o botão de recarregar.</p>
                </div>`;
        }
        return;
    }

    lanchesData = data;
    renderAll({ animate: !silent });
    setStatus('online', 'Conectado');
    updateLastSync();
}

function startAutoRefresh() {
    clearInterval(refreshTimer);
    refreshTimer = setInterval(() => {
        if (!document.hidden) loadData({ silent: true });
    }, REFRESH_INTERVAL_MS);
}

// ── DATA: WRITE ────────────────────────────────────────────
/**
 * Executa uma escrita e trata erros comuns. `query` deve terminar em .select('id')
 * para que uma escrita bloqueada pelo RLS (0 linhas afetadas) seja detetada.
 */
async function runWrite(query, failMsg) {
    if (!isEditor) {
        showToast('Inicia sessão como editor para alterar dados.', 'warning');
        return false;
    }
    const { data, error } = await query;
    if (error || !data || data.length === 0) {
        console.error(failMsg, error);
        const denied = !error || error.code === '42501' || error.code === 'PGRST301';
        if (denied) {
            showToast('Sem permissão ou registo inexistente. Inicia sessão novamente.', 'error');
            await refreshEditorState();
        } else if (error.code === '23514') {
            showToast('Dados inválidos (nome até 100 e observações até 300 caracteres).', 'error');
        } else {
            showToast(failMsg, 'error');
        }
        await loadData({ silent: true });
        return false;
    }
    await loadData({ silent: true });
    return true;
}

async function withBusyButton(btn, busyLabel, fn) {
    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = busyLabel;
    try {
        return await fn();
    } finally {
        btn.disabled = false;
        btn.textContent = label;
    }
}

function showLancheModal(id = null) {
    const lanche = id == null ? null : findLanche(id);
    if (id != null && !lanche) return;
    editTarget = lanche ? id : null;
    el.lancheTitle.textContent = lanche ? 'Editar lanche' : 'Novo lanche';
    el.saveBtn.textContent = lanche ? 'Guardar alterações' : 'Adicionar lanche';
    el.deleteBtn.classList.toggle('hidden', !lanche);
    el.athleteName.value = lanche ? lanche.nome : '';
    el.lunchDate.value = lanche ? lanche.data : todayStr();
    (lanche && lanche.entregue ? el.optDone : el.optPending).checked = true;
    el.lunchNotes.value = lanche ? lanche.observacoes : '';
    openModal(el.lancheModal, el.athleteName);
}

async function saveLanche(e) {
    e.preventDefault();
    const fields = {
        nome: el.athleteName.value.trim(),
        data: el.lunchDate.value,
        entregue: el.optDone.checked,
        observacoes: el.lunchNotes.value.trim(),
    };
    if (!fields.nome || !fields.data) {
        showToast('Preenche nome e data.', 'warning');
        return;
    }
    const id = editTarget;
    const query = id == null
        ? db.from('lanches').insert(fields).select('id')
        : db.from('lanches').update(fields).eq('id', id).select('id');
    const ok = await withBusyButton(el.saveBtn, 'A guardar...', () =>
        runWrite(query, id == null ? 'Erro ao adicionar lanche.' : 'Erro ao editar lanche.'));
    if (ok) {
        showToast(id == null ? `Lanche de ${fields.nome} adicionado.` : 'Lanche atualizado.', 'success');
        closeModal(el.lancheModal);
    }
}

async function toggleLanche(id, chip) {
    const lanche = findLanche(id);
    if (!lanche) return;
    chip.disabled = true;
    chip.classList.add('pop');
    const entregue = !lanche.entregue;
    const ok = await runWrite(
        db.from('lanches').update({ entregue }).eq('id', id).select('id'), 'Erro ao atualizar estado.');
    if (ok) showToast(`${lanche.nome}: ${entregue ? 'entregue' : 'pendente'}`, 'success');
}

function showConfirmDelete(id) {
    const lanche = findLanche(id);
    if (!lanche) return;
    deleteTarget = id;
    el.confirmMsg.innerHTML =
        `O lanche de <strong>${escHtml(lanche.nome)}</strong> vai ser eliminado. Esta ação não pode ser desfeita.`;
    openModal(el.confirmModal, el.confirmDeleteBtn);
}

async function confirmDelete() {
    if (deleteTarget == null) return;
    const id = deleteTarget;
    closeModal(el.confirmModal);
    closeModal(el.lancheModal);
    const ok = await runWrite(db.from('lanches').delete().eq('id', id).select('id'), 'Erro ao eliminar.');
    if (ok) showToast('Lanche eliminado.', 'info');
}

// ── AUTH ───────────────────────────────────────────────────
async function refreshEditorState() {
    const { data: { session } } = await db.auth.getSession();
    await applySession(session);
}

async function applySession(session) {
    let editor = false;
    if (session) {
        const { data, error } = await db.rpc('is_editor');
        if (error) {
            console.error('is_editor:', error);
            showToast('Não foi possível verificar permissões. Tenta recarregar.', 'error');
        } else if (data === true) {
            editor = true;
        } else {
            showToast('Esta conta não tem permissão para editar.', 'error');
            await db.auth.signOut();
            return; // onAuthStateChange volta a chamar applySession(null)
        }
    }
    isEditor = editor;
    document.body.classList.toggle('is-editor', isEditor);
    el.loginBtn.classList.toggle('hidden', isEditor);
    const email = isEditor ? session.user.email : '';
    el.userChip.textContent = email.charAt(0);
    el.userChip.title = email ? `Sessão: ${email}` : '';
    el.userChip.setAttribute('aria-label', email ? `Sessão iniciada como ${email}` : '');
    if (!isEditor) {
        closeModal(el.lancheModal);
        closeModal(el.confirmModal);
    }
    renderLanches({ animate: false });
}

async function login(e) {
    e.preventDefault();
    el.loginError.textContent = '';
    const email = el.loginEmail.value.trim();
    const password = el.loginPassword.value;
    const { error } = await withBusyButton(el.loginSubmitBtn, 'A entrar...', () =>
        db.auth.signInWithPassword({ email, password }));
    if (error) {
        el.loginError.textContent = error.status === 429
            ? 'Demasiadas tentativas. Aguarda alguns minutos.'
            : 'Email ou password inválidos.';
        return;
    }
    el.loginPassword.value = '';
    closeModal(el.loginModal);
    showToast('Sessão iniciada.', 'success');
}

async function logout() {
    await db.auth.signOut();
    showToast('Sessão terminada.', 'info');
}

// ── EVENT LISTENERS ────────────────────────────────────────
el.lancheForm.addEventListener('submit', saveLanche);
el.loginForm.addEventListener('submit', login);
el.addBtn.addEventListener('click', () => showLancheModal());
el.deleteBtn.addEventListener('click', () => showConfirmDelete(editTarget));
el.confirmDeleteBtn.addEventListener('click', confirmDelete);
el.loginBtn.addEventListener('click', () => {
    el.loginError.textContent = '';
    openModal(el.loginModal, el.loginEmail);
});
el.logoutBtn.addEventListener('click', logout);
el.refreshBtn.addEventListener('click', async () => {
    el.refreshBtn.classList.add('spinning');
    await loadData();
    el.refreshBtn.classList.remove('spinning');
});

document.querySelectorAll('.segmented button').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.segmented button').forEach(b => {
            b.classList.toggle('active', b === btn);
            b.setAttribute('aria-pressed', String(b === btn));
        });
        currentFilter = btn.dataset.filter;
        renderLanches();
    });
});

el.searchInput.addEventListener('input', () => {
    searchQuery = el.searchInput.value.trim();
    renderLanches({ animate: false });
});

// Ações da lista (delegação: sem handlers inline)
el.lanchesList.addEventListener('click', e => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const id = Number(btn.closest('.item').dataset.id);
    if (btn.dataset.action === 'edit') showLancheModal(id);
    if (btn.dataset.action === 'toggle') toggleLanche(id, btn);
});

// Fechar modais: botões [data-close], clique fora, tecla Esc
document.querySelectorAll('[data-close]').forEach(btn =>
    btn.addEventListener('click', () => closeModal($(btn.dataset.close))));
document.querySelectorAll('.overlay').forEach(overlay =>
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(overlay); }));
document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    const open = [...document.querySelectorAll('.overlay:not(.hidden)')];
    if (open.length) closeModal(open[open.length - 1]);
});

document.addEventListener('visibilitychange', () => {
    if (!document.hidden && db) loadData({ silent: true });
});

// ── INIT ───────────────────────────────────────────────────
function showFatal(msg) {
    setStatus('offline', 'Não configurado');
    el.lanchesList.innerHTML = `
        <div class="empty">
            <svg width="48" height="48" aria-hidden="true"><use href="#i-ball"/></svg>
            <p>${escHtml(msg)}</p>
        </div>`;
}

async function initApp() {
    let config;
    try {
        const res = await fetch(`config.json?v=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        config = await res.json();
    } catch (err) {
        console.error('config.json:', err);
        showFatal('Não foi possível carregar config.json.');
        return;
    }
    if (!window.supabase || !config.supabaseUrl || !config.supabaseKey) {
        showFatal('Configuração da base de dados em falta ou biblioteca não carregada.');
        return;
    }

    db = window.supabase.createClient(config.supabaseUrl, config.supabaseKey);
    // setTimeout: evitar chamadas ao Supabase dentro do callback (recomendação da biblioteca)
    db.auth.onAuthStateChange((_event, session) => setTimeout(() => applySession(session), 0));

    await loadData();
    startAutoRefresh();
}

initApp();
</script>
</body>
</html>
